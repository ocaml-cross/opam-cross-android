name: setup-cross
description: Locate the NDK, restore the opam switch, and register this repository.

inputs:
  ocaml-version:
    required: true
  android-api:
    required: true
  cache-key:
    required: true
  cache-read-only:
    description: Jobs that only consume the switch should not race to write it.
    default: "true"

outputs:
  toolpref:
    description: NDK compiler path prefix, for TOOLPREF64.
    value: ${{ steps.ndk.outputs.prefix }}
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Locate the NDK
      id: ndk
      shell: bash
      run: |
        # The runner images ship one; fall back to installing it so this does
        # not silently depend on that staying true.
        NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
        if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
          sdkmanager --install "ndk;27.2.12479018"
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
        fi
        echo "prefix=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ inputs.android-api }}-" >> "$GITHUB_OUTPUT"

    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ inputs.ocaml-version }}

    - uses: actions/cache@v4
      id: cache
      if: inputs.cache-read-only != 'true'
      with:
        # The switch lives in the workspace, not the opam root, so caching only
        # ~/.opam leaves every job rebuilding the cross compiler. Restored after
        # setup-ocaml, which re-initialises the switch and would wipe it.
        path: |
          ~/.opam
          _opam
        key: ${{ inputs.cache-key }}

    - uses: actions/cache/restore@v4
      if: inputs.cache-read-only == 'true'
      with:
        # The switch lives in the workspace, not the opam root, so caching only
        # ~/.opam leaves every job rebuilding the cross compiler. Restored after
        # setup-ocaml, which re-initialises the switch and would wipe it.
        path: |
          ~/.opam
          _opam
        key: ${{ inputs.cache-key }}

    - name: Register this repository
      shell: bash
      # `opam repository add <dir>` snapshots the directory into the opam root.
      # The root is restored from the cache, so a repository that is already
      # there is a copy of this repository as it was when the cache was built.
      # Selecting it as-is builds stale package definitions -- silently, and
      # only for packages outside the cache key, which is the hardest form to
      # notice. It is replaced from the checkout on every job.
      run: |
        set -eu
        opam repository remove android --all >/dev/null 2>&1 || true
        rm -rf "$(opam var root)/repo/android"
        opam repository add android .
        opam repository list --short
